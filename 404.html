  <meta charset="UTF-8">

  <title>Page Not Found | Convert Currency</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; --muted: #64748b; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
    h1 { font-size: 5rem; margin-bottom: 1rem; }
    h2 { font-size: 1.5rem; margin-bottom: 1rem; }
    p { color: var(--muted); margin-bottom: 2rem; max-width: 400px; }
    .redirect-info { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 1rem; margin: 1rem auto; max-width: 400px; font-size: 0.9rem; color: #1e40af; display: none; }
    a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .btn { background: var(--primary); color: white; padding: 0.75rem 1.5rem; border-radius: 0.5rem; display: inline-block; }
    .btn:hover { background: #1d4ed8; }
    .links { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  </style>

<body>
  <h1>💱</h1>
  <h2>Page Not Found</h2>
  <p>The page you're looking for doesn't exist or may have moved.</p>
  <div class="redirect-info" id="redirectInfo"></div>
  <div class="links">
    <a href="/" class="btn">Go to Converter</a>
    <a href="/articles/">Articles</a>
    <a href="/fee-estimator/">Fee Estimator</a>
  </div>
  <script>
  (function() {
    var pathname = window.location.pathname;
    var lower = pathname.toLowerCase();
    var parts = lower.replace(/\/+$/,'').split('/').filter(function(p){return p;});
    var redirectUrl = null;
    var reason = '';

    // Pattern 1: Uppercase currency codes - /USD-to-EUR → /usd-to-eur
    if (parts.length === 1 && /^[a-z]{3}-to-[a-z]{3}$/.test(parts[0]) && pathname !== lower) {
      redirectUrl = '/' + parts[0] + '/';
      reason = 'Normalizing currency code case';
    }

    // Pattern 2: Missing trailing slash on pair pages
    if (!redirectUrl && parts.length === 1 && /^[a-z]{3}-to-[a-z]{3}$/.test(parts[0]) && !pathname.match(/\/$/)) {
      redirectUrl = '/' + parts[0] + '/';
      reason = 'Adding trailing slash';
    }

    // Pattern 3: /pairs/{pair} → /{pair}/
    if (!redirectUrl && parts[0] === 'pairs' && parts.length === 2 && /^[a-z]{3}-to-[a-z]{3}$/.test(parts[1])) {
      redirectUrl = '/' + parts[1] + '/';
      reason = 'Redirecting from old URL format';
    }

    // Pattern 4: Reversed pair - /inr-to-aed doesn't exist but /aed-to-inr does
    // We can't check existence client-side, but we can try the reversed form
    if (!redirectUrl && parts.length === 1 && /^[a-z]{3}-to-[a-z]{3}$/.test(parts[0])) {
      var currencies = parts[0].split('-to-');
      if (currencies.length === 2) {
        redirectUrl = '/' + currencies[1] + '-to-' + currencies[0] + '/';
        reason = 'Trying reversed currency pair';
      }
    }

    // Pattern 5: /convert/USD/EUR or /USD/EUR → /usd-to-eur/
    if (!redirectUrl && parts.length >= 2) {
      var start = (parts[0] === 'convert') ? 1 : 0;
      if (parts.length >= start + 2 && /^[a-z]{3}$/.test(parts[start]) && /^[a-z]{3}$/.test(parts[start+1])) {
        redirectUrl = '/' + parts[start] + '-to-' + parts[start+1] + '/';
        reason = 'Redirecting to currency pair page';
      }
    }

    // Pattern 6: Generic trailing slash
    if (!redirectUrl && !pathname.match(/\.\w+$/) && !pathname.match(/\/$/)) {
      redirectUrl = pathname + '/';
      reason = 'Adding trailing slash';
    }

    if (redirectUrl && redirectUrl !== pathname && redirectUrl !== pathname + '/') {
      var el = document.getElementById('redirectInfo');
      el.innerHTML = '<strong>' + reason + '</strong><br>Redirecting to <a href="' + redirectUrl + '" style="color:#1e40af;text-decoration:underline">' + redirectUrl + '</a>...';
      el.style.display = 'block';
      setTimeout(function(){ window.location.href = redirectUrl; }, 2000);
    }
  })();
  </script>
  </div>
  </div>
  </body>
